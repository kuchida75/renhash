name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n renhash
      - name: Run end-to-end regression tests
        run: python3 -m unittest discover -s tests -v
